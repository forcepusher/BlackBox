name: Release

# Builds Sloperator.exe on a clean Windows machine with scripts/publish.ps1.
# - A published GitHub release: SignPath signs the exe (once SIGNPATH_API_TOKEN is set) and it is
#   attached to the release.
# - Run by hand (Actions > Release > Run workflow): the same, kept as a build artifact only.
# - A push that changes the build itself: built, never signed, to see the build still works.
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/release.yml
      - scripts/publish.ps1
      - scripts/pack-runtime.cs
      - Directory.Build.props
      - "src/**/*.csproj"

permissions:
  contents: write   # attach the exe to the release
  actions: read     # SignPath reads the unsigned artifact

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        shell: pwsh
        run: ./scripts/publish.ps1

      - name: Upload the unsigned exe
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Sloperator-unsigned
          path: publish/Sloperator.exe

      # SignPath Foundation signs only what this workflow built from the repository, after the
      # approver accepts the request on signpath.io; the run waits for that, up to an hour.
      - name: Sign with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Sloperator' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Pick the exe to ship
        shell: pwsh
        run: |
          $exe = if ($env:SIGN -eq 'true') { 'signed/Sloperator.exe' } else { 'publish/Sloperator.exe' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe out/Sloperator.exe
          $sig = Get-AuthenticodeSignature out/Sloperator.exe
          Write-Host "Signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($env:SIGN -eq 'true' -and $sig.Status -ne 'Valid') { throw "SignPath returned an exe without a valid signature" }

      - uses: actions/upload-artifact@v4
        with:
          name: Sloperator
          path: out/Sloperator.exe

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/Sloperator.exe --clobber
