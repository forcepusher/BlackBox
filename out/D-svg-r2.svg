<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Segoe UI, sans-serif">
  <!-- Background -->
  <rect width="390" height="844" fill="#eef1f4"/>

  <!-- Header -->
  <rect x="0" y="0" width="390" height="104" fill="#ffffff"/>
  <line x1="0" y1="104" x2="390" y2="104" stroke="#dde2e6" stroke-width="1"/>

  <!-- Status bar -->
  <text x="24" y="30" font-size="14" font-weight="600" fill="#1c1c1e">9:41</text>
  <rect x="316" y="20" width="3" height="9" rx="1" fill="#1c1c1e"/>
  <rect x="321" y="17" width="3" height="12" rx="1" fill="#1c1c1e"/>
  <rect x="326" y="14" width="3" height="15" rx="1" fill="#1c1c1e"/>
  <rect x="331" y="11" width="3" height="18" rx="1" fill="#1c1c1e"/>
  <rect x="342" y="14" width="24" height="13" rx="3" fill="none" stroke="#1c1c1e" stroke-width="1.5"/>
  <rect x="367.5" y="17.5" width="2.5" height="6" rx="1" fill="#1c1c1e"/>
  <rect x="344.5" y="16.5" width="15" height="8" rx="1.5" fill="#1c1c1e"/>

  <!-- Back arrow -->
  <path d="M28 74 L18 62 L28 50" fill="none" stroke="#0b8457" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Avatar -->
  <circle cx="72" cy="62" r="24" fill="#0b8457"/>
  <circle cx="72" cy="55" r="8" fill="#ffffff"/>
  <path d="M58 76 a14 11 0 0 1 28 0 z" fill="#ffffff"/>
  <circle cx="87" cy="45" r="5" fill="#4cd964" stroke="#ffffff" stroke-width="2"/>

  <!-- Contact name -->
  <text x="108" y="58" font-size="19" font-weight="600" fill="#1c1c1e">Emma Wilson</text>
  <text x="108" y="78" font-size="13" fill="#0b8457">online</text>

  <!-- Video / call icons -->
  <path d="M318 54 h14 l10 -8 v32 l-10 -8 h-14 z" fill="none" stroke="#0b8457" stroke-width="2" stroke-linejoin="round"/>
  <path d="M360 56 v16 a6 6 0 0 0 6 6 h6 a6 6 0 0 0 6 -6 v-16 a6 6 0 0 0 -6 -6 h-6 a6 6 0 0 0 -6 6 z" fill="none" stroke="#0b8457" stroke-width="2"/>

  <!-- ===== Messages ===== -->

  <!-- 1. Received (2 lines) -->
  <rect x="16" y="118" width="240" height="60" rx="16" fill="#ffffff"/>
  <text x="32" y="142" font-size="15" fill="#1c1c1e">Hey! Did you get a chance to</text>
  <text x="32" y="161" font-size="15" fill="#1c1c1e">look at the plans?</text>
  <text x="16" y="192" font-size="11" fill="#9aa0a6">9:02 AM</text>

  <!-- 2. Sent (2 lines) -->
  <rect x="142" y="206" width="232" height="60" rx="16" fill="#0b8457"/>
  <text x="158" y="230" font-size="15" fill="#ffffff">Not yet — been pretty busy</text>
  <text x="158" y="249" font-size="15" fill="#ffffff">with the project today.</text>
  <text x="374" y="280" font-size="11" fill="#9aa0a6" text-anchor="end">9:04 AM  ✓✓</text>

  <!-- 3. Received (3 lines) -->
  <rect x="16" y="294" width="268" height="80" rx="16" fill="#ffffff"/>
  <text x="32" y="318" font-size="15" fill="#1c1c1e">Sure. Basically we're moving</text>
  <text x="32" y="337" font-size="15" fill="#1c1c1e">the checkout to a two-step flow</text>
  <text x="32" y="356" font-size="15" fill="#1c1c1e">so users can save carts later.</text>
  <text x="16" y="388" font-size="11" fill="#9aa0a6">9:05 AM</text>

  <!-- 4. Sent (1 line) -->
  <rect x="218" y="402" width="156" height="40" rx="16" fill="#0b8457"/>
  <text x="234" y="427" font-size="15" fill="#ffffff">That makes sense.</text>
  <text x="374" y="456" font-size="11" fill="#9aa0a6" text-anchor="end">9:06 AM  ✓✓</text>

  <!-- 5. Received (2 lines) -->
  <rect x="16" y="470" width="232" height="60" rx="16" fill="#ffffff"/>
  <text x="32" y="494" font-size="15" fill="#1c1c1e">Do you think we should add</text>
  <text x="32" y="513" font-size="15" fill="#1c1c1e">a guest option as well?</text>
  <text x="16" y="544" font-size="11" fill="#9aa0a6">9:07 AM</text>

  <!-- 6. Sent (3 lines) -->
  <rect x="112" y="558" width="262" height="80" rx="16" fill="#0b8457"/>
  <text x="128" y="582" font-size="15" fill="#ffffff">I'd be careful — too many edge</text>
  <text x="128" y="601" font-size="15" fill="#ffffff">cases with payments and</text>
  <text x="128" y="620" font-size="15" fill="#ffffff">account merging later.</text>
  <text x="374" y="652" font-size="11" fill="#9aa0a6" text-anchor="end">9:09 AM  ✓✓</text>

  <!-- 7. Received (1 line) -->
  <rect x="16" y="666" width="320" height="40" rx="16" fill="#ffffff"/>
  <text x="32" y="691" font-size="15" fill="#1c1c1e">Fair point. Keeping it simple for v1.</text>
  <text x="16" y="720" font-size="11" fill="#9aa0a6">9:10 AM</text>

  <!-- 8. Sent (1 line) -->
  <rect x="64" y="734" width="310" height="40" rx="16" fill="#0b8457"/>
  <text x="80" y="759" font-size="15" fill="#ffffff">Agreed. I'll sketch the flow tomorrow.</text>
  <text x="374" y="788" font-size="11" fill="#9aa0a6" text-anchor="end">9:11 AM  ✓✓</text>

  <!-- ===== Input bar ===== -->
  <rect x="12" y="800" width="314" height="40" rx="20" fill="#ffffff" stroke="#dde2e6" stroke-width="1"/>
  <!-- Attachment icon -->
  <circle cx="34" cy="820" r="9" fill="none" stroke="#9aa0a6" stroke-width="2"/>
  <circle cx="34" cy="820" r="3" fill="#9aa0a6"/>
  <text x="54" y="825" font-size="14" fill="#9aa0a6">Message</text>

  <!-- Send button -->
  <circle cx="352" cy="820" r="20" fill="#0b8457"/>
  <path d="M344 828 L361 820 L344 812 L347 820 Z" fill="#ffffff"/>

  <!-- Home indicator -->
  <rect x="120" y="834" width="150" height="5" rx="2.5" fill="#1c1c1e"/>
</svg>
