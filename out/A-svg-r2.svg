<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181D"/>
      <stop offset="1" stop-color="#0D0F13"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle decorative glows -->
  <circle cx="1050" cy="150" r="260" fill="#FCC21B" opacity="0.04"/>
  <circle cx="180" cy="680" r="240" fill="#FCC21B" opacity="0.03"/>

  <!-- Top bar -->
  <!-- Logo: yellow rounded square with an S -->
  <g transform="translate(48,40)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="#FCC21B"/>
    <path d="M28.5 13.5 C27 11.6 24.6 10.8 22 10.8 C17.8 10.8 14.6 12.8 14.6 16.4 C14.6 21.6 28.4 20 28.4 26.4 C28.4 30.2 25.2 32.4 21.2 32.4 C18.4 32.4 15.8 31.4 14.2 29.4"
          fill="none" stroke="#16181D" stroke-width="3.6" stroke-linecap="round"/>
  </g>

  <!-- App name -->
  <text x="108" y="70" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#F2F3F5" letter-spacing="0.5">Sloperator</text>

  <!-- Card -->
  <g filter="url(#cardShadow)">
    <rect x="460" y="190" width="360" height="392" rx="16" fill="#1E2128" stroke="#2C3038" stroke-width="1"/>
  </g>

  <!-- Card heading -->
  <text x="640" y="246" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600" fill="#F2F3F5">Welcome back</text>
  <text x="640" y="272" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13.5" fill="#8B909C">Sign in to continue to Sloperator</text>

  <!-- Email field -->
  <text x="492" y="314" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#A7ACB8" letter-spacing="0.4">EMAIL</text>
  <rect x="492" y="326" width="296" height="44" rx="8" fill="#14161B" stroke="#333845" stroke-width="1"/>
  <g transform="translate(508,342)" stroke="#6E7482" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="14" height="11" rx="2"/>
    <path d="M0.5 1.5 L7 6 L13.5 1.5"/>
  </g>
  <text x="534" y="353" font-family="Segoe UI, sans-serif" font-size="14" fill="#4C5160">you@example.com</text>

  <!-- Password field -->
  <text x="492" y="402" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600" fill="#A7ACB8" letter-spacing="0.4">PASSWORD</text>
  <rect x="492" y="414" width="296" height="44" rx="8" fill="#14161B" stroke="#333845" stroke-width="1"/>
  <g transform="translate(508,430)" stroke="#6E7482" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="5" width="14" height="10" rx="2"/>
    <path d="M3 5 V3.5 A4 4 0 0 1 11 3.5 V5"/>
  </g>
  <g fill="#4C5160">
    <circle cx="540" cy="436" r="2"/>
    <circle cx="549" cy="436" r="2"/>
    <circle cx="558" cy="436" r="2"/>
    <circle cx="567" cy="436" r="2"/>
    <circle cx="576" cy="436" r="2"/>
    <circle cx="585" cy="436" r="2"/>
    <circle cx="594" cy="436" r="2"/>
    <circle cx="603" cy="436" r="2"/>
  </g>

  <!-- Forgot password link -->
  <text x="788" y="488" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#FCC21B">Forgot password?</text>

  <!-- Continue button -->
  <rect x="492" y="504" width="296" height="48" rx="10" fill="#FCC21B"/>
  <text x="640" y="534" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#16181D" letter-spacing="0.4">Continue</text>

  <!-- Create account line under card -->
  <text x="640" y="624" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#8B909C">New here? <tspan fill="#FCC21B" font-weight="600">Create an account</tspan></text>
</svg>
